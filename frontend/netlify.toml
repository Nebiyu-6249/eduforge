# Hosted prototype: the frontend on Netlify talks to the backend on Render.
# `netlify deploy` builds with these settings (the CLI builds before deploying).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://eduforge-api-muqc.onrender.com"
  NODE_VERSION = "22"
