[project]
name = "eduforge-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-dateutil>=4.0.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "reportlab>=5.1.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
# B008: FastAPI's Depends()/File() defaults. FURB167/C408: style only.
# B023: closures in mapper._weekly are called within the same iteration.
ignore = ["B008", "FURB167", "C408", "B023", "SIM102", "RUF007", "C405"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# Start lenient (plan 0.2 asks for a type-check step); tighten module by module.
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["alembic/", "tests/"]
