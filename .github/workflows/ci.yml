# IMPLEMENTATION_PLAN 0.2: lint, type-check, unit tests and a migration check
# on every PR; blocks merges when red (enable branch protection on main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eduforge
          POSTGRES_PASSWORD: eduforge
          POSTGRES_DB: eduforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eduforge" --health-interval 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: none  # tests never call a real model
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check app tests
      - name: Type-check (mypy)
        run: uv run mypy app
      - name: Unit + acceptance tests
        run: uv run pytest -q
      - name: Migrations apply cleanly on Postgres and match the models
        env:
          DATABASE_URL: postgresql+psycopg://eduforge:eduforge@localhost:5432/eduforge
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Extraction eval (synthetic gold)
        run: uv run python ../eval/extraction.py --synthetic

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type-check (tsc)
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npx vite build
